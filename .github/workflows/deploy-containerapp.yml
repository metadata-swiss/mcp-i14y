name: Build, Push & Deploy MCP Docker Image to ACR

on:
  push:
    branches:
      - main
      - master
      - releases/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: read

env:
  IMAGE_NAME: mcp-i14y

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d9e0f98d3fc6adb07d1e3d37f3043649ddad06a1 # v5

      - name: Install application and dev dependencies
        run: uv sync --all-groups

      - name: Install security tools
        # setuptools<81 is required because semgrep depends on an old
        # opentelemetry-instrumentation that still imports pkg_resources.
        # setuptools 81 removed pkg_resources, so we must pin below that.
        run: python -m pip install --upgrade pip "setuptools<81" pip-audit==2.9.0 bandit==1.8.6 semgrep==1.99.0

      - name: Run tests and Python security checks
        run: |
          python -m pip check
          if [ -d tests ]; then uv run pytest tests/ -m 'not integration'; fi
          # pip-audit scans the resolved dependency tree exported from the uv lockfile.
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          python -m pip_audit -r /tmp/requirements.txt --progress-spinner off
          # bandit is scoped to first-party source to avoid noise from tests and .venv.
          python -m bandit -r helpers/ tools/ main.py -ll

      - name: Run Semgrep OWASP security scan
        run: |
          semgrep scan --config p/python --config p/owasp-top-ten --severity ERROR --error --skip-unknown-extensions --exclude tests --exclude .venv --exclude venv

      - name: Scan repository history for secrets (gitleaks CLI)
        # The gitleaks binary itself is MIT-licensed and free for any use,
        # including organizations. We invoke the CLI directly (with pinned
        # version + sha256) instead of gitleaks-action to avoid the paid
        # organization license required by the action wrapper.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  image-build-and-push:
    needs: security-checks
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compose image tag
        run: |
          TAG="$(date +"%Y%m%d%H%M%S")"
          echo "DOCKER_VERSION=$TAG" >> $GITHUB_ENV
          echo "SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Azure Login (UAMI via OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_ACR_UAMI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ACR_SUBSCRIPTION_ID }}

      - name: Login to ACR
        env:
          AZURE_ACR: ${{ secrets.AZURE_ACR }}
        run: |
          az acr login --name "${AZURE_ACR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image locally
        env:
          AZURE_ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${AZURE_ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_FULL=${IMAGE}:${DOCKER_VERSION}" >> "$GITHUB_ENV"
          echo "Building ${IMAGE}:$DOCKER_VERSION"

          docker buildx build . \
            --load \
            --label org.opencontainers.image.version="$DOCKER_VERSION" \
            --label org.opencontainers.image.revision="$SHA" \
            -t "$IMAGE:$DOCKER_VERSION" \
            -t "$IMAGE:${SHA}" \
            -t "$IMAGE:latest"

      - name: Scan final image for fixable High and Critical vulnerabilities
        # Trivy CLI (Apache-2.0) installed directly instead of via
        # aquasecurity/trivy-action, whose install.sh has been failing
        # silently on the pinned v0.65.0 release.
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy --version
          /tmp/trivy image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "${IMAGE_FULL}"

      - name: Push scanned image
        env:
          AZURE_ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
        run: |
          IMAGE="${AZURE_ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}"
          docker push "$IMAGE:$DOCKER_VERSION"
          docker push "$IMAGE:${SHA}"
          docker push "$IMAGE:latest"

      - name: Deploy to DEV
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          AZURE_ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          IMAGE="${AZURE_ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:$DOCKER_VERSION"
          echo "Updating Container App $APP_NAME in $RG to image $IMAGE"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

      - name: Show active revision
        run: |
          az containerapp revision list \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.active==\`true\`].{name:name, traffic:properties.trafficWeight, image:properties.template.containers[0].image}" \
            -o table
